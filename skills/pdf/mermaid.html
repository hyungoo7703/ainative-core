<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
document.querySelectorAll('pre > code.mermaid, pre.mermaid').forEach(el => {
  const pre = el.tagName === 'PRE' ? el : el.parentElement;
  const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = el.textContent; pre.replaceWith(div);
});
mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
</script>
